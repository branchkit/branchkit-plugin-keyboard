<div id="settings-table-container" class="settings-table">
    <div class="table-header">
        <div>Keybind</div>
        <div>Action</div>
        <div>Source</div>
        <div style="text-align: right;">
            {{if .HasOverrides}}
            <button style="font-size: 11px; padding: 2px 8px;" data-on:click="fetch('/v1/plugins/keybinds/hooks/reset-all', {method: 'POST'})">Reset All</button>
            {{end}}
        </div>
    </div>
    {{range .Groups}}
    <div style="padding: 8px 20px; background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.05em;">
        {{.SourceName}}
    </div>
    {{range .Rows}}
    <div class="settings-row{{if .IsOverride}} modified{{end}}">
        <div class="label" style="display: flex; align-items: center; gap: 6px;">
            {{if eq $.RemappingCombo .ComboKey}}
            <input type="text" readonly placeholder="Press new key combo..."
                   style="flex: 1; border-color: var(--accent); animation: pulse 1.5s infinite;"
                   id="remap-input"
                   data-init="document.getElementById('remap-input').focus()"
                   data-on:keydown="captureRemap(evt, '{{.ComboKey}}', {{.IsHold}})"
                   data-on:blur__debounce.200ms="fetch('/v1/plugins/keybinds/hooks/cancel-remap', {method: 'POST'})">
            <button class="icon-btn" title="Cancel" data-on:click="fetch('/v1/plugins/keybinds/hooks/cancel-remap', {method: 'POST'})">&#10005;</button>
            {{else}}
            <span style="font-family: 'SF Mono', monospace;">{{.ComboDisplay}}</span>
            <button class="icon-btn edit-btn" title="Remap keybind"
                    data-on:click="fetch('/v1/plugins/keybinds/hooks/start-remap', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({combo: '{{.ComboKey}}'})})">&#9998;</button>
            {{if .IsOverride}}
            <button class="icon-btn" title="Reset to default"
                    data-on:click="fetch('/v1/plugins/keybinds/hooks/reset', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({combo_key: '{{.ComboKey}}', is_hold: {{.IsHold}}})})">&#x21ba;</button>
            {{end}}
            {{end}}
        </div>
        <div class="value">{{.ActionLabel}}</div>
        <div><span class="badge {{.BadgeClass}}">{{.SourceLabel}}</span></div>
    </div>
    {{end}}
    {{end}}
</div>

<style>
@keyframes pulse {
    0%, 100% { border-color: var(--accent); }
    50% { border-color: rgba(0, 122, 255, 0.3); }
}
</style>

<!-- captureRemap() is in /branchkit-ui.js (loaded by frame.html) -->
