name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        working-directory: src
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: src
        run: go vet ./...
      - name: test
        working-directory: src
        run: go test ./...
      - name: build
        working-directory: src
        run: go build -o ../keyboard-plugin .
